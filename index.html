<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northlight Animation Studio</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
        }
        .container { max-width: 800px; margin: auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #ffffff; font-size: 2.5em; margin-bottom: 10px; }
        .hero-image { 
            width: 100%; 
            max-width: 600px; 
            height: auto; 
            border-radius: 12px; 
            margin: 20px 0; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
        }
        .highlight { font-weight: bold; color: #ff9f43; }
        section { background: #2d2d2d; padding: 25px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Northlight Animation Studio</h1>
            <p><em>Független 2D animációs műhely | Alkotó: Király Zsolt</em></p>
        </header>

        <main>
            <section>
                <h2>Üdvözlünk a stúdióban!</h2>
                <p>Klasszikus, kézzel rajzolt animációk nosztalgikus hangulatban.</p>
                
                <img src="elodiedress.png" alt="Elodie és az Elveszett Hercegnők" class="hero-image">

                <h3>Aktuális projekt</h3>
                <p><strong>Elodie és az Elveszett Hercegnők</strong><br>
                Grimm-adaptáció fejlesztés alatt.</p>
                <p class="highlight">Várható bemutató: 2028–2029</p>
            </section>
        </main>
    </div>

</body>
</html>
